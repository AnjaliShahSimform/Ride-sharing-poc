services:
  - type: web
    name: ride-sharing-poc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand: the Dockerfile's CMD applies pending migrations and
    # then starts the server (Render doesn't shell-parse dockerCommand).
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render free instances spin down after 15 min idle and cold-start on
      # the next request — migrate deploy runs again on every cold start too,
      # which is safe: it's a no-op once all migrations are already applied.
      - key: DATABASE_URL
        sync: false # Neon's POOLED connection string (the one with "-pooler" in the host)
      - key: DIRECT_URL
        sync: false # Neon's DIRECT (unpooled) connection string — required by prisma migrate deploy
      - key: FRONTEND_ORIGIN
        sync: false # the deployed frontend's URL (e.g. the Render static site's origin)
      - key: JWT_SECRET
        generateValue: true # Render generates and stores a random secret
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: REFRESH_REUSE_GRACE_SECONDS
        value: "10"
      - key: LOG_LEVEL
        value: info
      # Email notifications. The relay + consumer run inside this web service
      # (RUN_WORKER_IN_PROCESS) because Render's free plan has no free
      # background worker. Use free tiers: CloudAMQP "Little Lemur" for
      # RabbitMQ, Brevo (300 emails/day) or Gmail + app password for SMTP.
      - key: AMQP_URL
        sync: false # CloudAMQP's amqps:// connection URL
      - key: SMTP_HOST
        sync: false # e.g. smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false # a sender address your SMTP provider has verified
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # Rate-limit counters. Optional: unset = in-memory (reset on every
      # restart/cold start). Free tiers: Upstash or Redis Cloud (rediss:// URL).
      - key: REDIS_URL
        sync: false
      # Private object storage for vehicle documents (RC / licence): any
      # S3-compatible host, e.g. Supabase Storage free tier (no card). The
      # bucket must be private; files are only served via 60s signed URLs.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false # the host browsers can reach; usually the same as S3_ENDPOINT
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: SMS_DRIVER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
  - type: web
    name: ride-sharing-poc-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # the deployed API service's URL
